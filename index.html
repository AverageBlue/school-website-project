<script>
    slot = 1
    function addToCart(item) {
        cart = document.getElementById("cart-contents");
        var link = document.createElement('div');
        link.innerText = item;
        cart.appendChild(link);
    }
</script>
<script>
    const input = document.getElementById("search-bar");

    input.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            const value = input.value.toLowerCase();

            if (value === 'microwave') {
                document.location = 'microwave.html';
            }
            else if (value === 'fridge') {
                document.location = 'fridge.html';
            }
            else if (value === 'oven') {
                document.location = 'oven.html';
            }
        }
    });
</script>
