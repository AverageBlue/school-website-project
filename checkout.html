<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkout</title>
    <link rel="stylesheet" href="checkout.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    

    
</head>



<body style="background-color: rgb(85, 125, 227);">
<a href="index.html">
    <img src="DingLee.png" width="100" height="100" id="Ding_Lee" alt="DingLee">
</a>
    <div class="loginbox" style="background-color: white;">
        

        <div class="login-container">
            <h2>Payment</h2>
            <div class="forms">
                <form class="left">
                    <h3>Send To</h3>
                    <input type="text" name="Address" placeholder="Address" required>
                    <input type="text" name="Email" placeholder="email" required>
                    <input type="text" name="Email" placeholder="confirm email" required>
                    <input type="tel" name="phoneNumber" placeholder="phone number" required>
                </form>
                <form class="right">
                    <h4>Card Info</h4>
                    <input type="text" name="card number" placeholder="e.g. 12345678..." required>
                    <input type="text" name="name" placeholder="first name last name" required>
                    <input type="text" name="cvv" placeholder="Security code" required>
                    <input type="date" name="expiry">
                </form>   
            </div>
                <button type="submit" onclick="window.location.href='purchase.html'">Order</button>
        </div>
    </div>

</body>
</html>
